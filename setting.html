<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setting</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#1e3a8a;--accent:#2563eb;--line:#dbe3ef;--success:#15803d;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px}header{background:linear-gradient(135deg,var(--text),var(--primary));color:white;padding:20px 16px 24px;border-radius:0 0 28px 28px;box-shadow:0 12px 30px #0f172a30}h1{margin:0;font-size:22px}header p{margin:6px 0 0}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 8px 24px #0f172a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.row{display:flex;gap:10px}.row>*{flex:1}label{display:block;font-weight:800;font-size:13px;margin-bottom:8px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;color:var(--text)}button{border:0;border-radius:15px;padding:12px 14px;font-weight:900;cursor:pointer;width:100%;margin-top:8px}.primary{background:var(--primary);color:white}.green{background:var(--success);color:white}.red{background:var(--danger);color:white}.nav{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:9px;z-index:10}.nav a{border-radius:16px;padding:10px 6px;text-align:center;text-decoration:none;font-weight:900;color:var(--muted)}.nav a.on{background:var(--primary);color:white}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.pill{background:#eef2ff;color:var(--primary);padding:6px 10px;border-radius:999px;font-weight:900;font-size:12px}.money{font-size:22px;font-weight:1000;color:var(--primary)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:8px;text-align:center}th{background:#eef2ff}td.left,th.left{text-align:left}.scroll{overflow:auto}.small{font-size:12px;color:var(--muted)}.item-card{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:end;border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0;background:#fff}.item-card b{display:block;margin-bottom:4px}.qty{font-size:18px;font-weight:900;text-align:center}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:520px){.wrap{padding:10px}.card{padding:12px}.item-card{grid-template-columns:1fr 78px}th,td{padding:6px;font-size:12px}}</style></head><body><header><h1>Setting</h1><p data-brand></p></header><main class="wrap"><section class="card"><h2>Tampilan Aplikasi</h2><div class="grid" id="themeBox"></div><button class="primary" onclick="saveTheme()">Simpan Warna</button></section><section class="card"><h2>Tambah Item</h2><div class="grid"><label>Kategori<select id="kat"><option value="produk">Penjualan Bubur</option><option value="extra">Extra Topping</option><option value="minuman">Minuman/Lainnya</option><option value="stok">Stok Perlengkapan</option><option value="kurang">Cek Barang Kurang</option></select></label><label>Nama<input id="nama" placeholder="Nama item"></label><label>Harga<input id="harga" type="number" placeholder="Harga"></label></div><button class="green" onclick="addItem()">Tambah Item</button></section><div id="lists"></div><section class="card"><button class="red" onclick="resetDefault()">Reset Semua Setting Default</button></section></main><div id="navbox"></div><script>const DEFAULT_ITEMS={produk:[{nama:'Bubur Ori',harga:7000},{nama:'Bubur Cakwe',harga:12000},{nama:'Bubur Telur',harga:12000},{nama:'Bubur Ayam Suwir',harga:15000},{nama:'Bubur Abon',harga:17000},{nama:'Bubur Spesial',harga:13000},{nama:'Bubur Istimewa',harga:17000}],extra:[{nama:'Cakwe',harga:2000},{nama:'Ayam Suwir',harga:3000},{nama:'Abon',harga:5000},{nama:'Irisan Telur Dadar',harga:1000},{nama:'Telur Rebus',harga:1000},{nama:'Kuah',harga:500},{nama:'Krupuk',harga:500}],minuman:[{nama:'Puyuh',harga:3000},{nama:'Cleo',harga:1000},{nama:'Teh Anget',harga:3000},{nama:'Es Teh',harga:3000}],stok:['Paper Bowl','Tali Segel','Sendok','Krupuk','Kripik Pangsit','Bawang Goreng','Kacang Kedelai'],kurang:['Cleo','Tisu','Plastik Kecap','Plastik Kuah','Plastik Sambal','Kecap Asin','Kecap Manis','Lada','Kresek Kecil','Kresek Tanggung','Kresek Besar']};
const DEFAULT_THEME={brand:'Bubur Ayam Bandung Akang Hamzah',bg:'#f4f7fb',card:'#ffffff',text:'#0f172a',primary:'#1e3a8a',accent:'#2563eb',success:'#15803d',danger:'#b91c1c'};
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}function rp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}function clone(o){return JSON.parse(JSON.stringify(o))}function getItems(){let x=JSON.parse(localStorage.getItem('app_items')||'null');if(!x){x=clone(DEFAULT_ITEMS);localStorage.setItem('app_items',JSON.stringify(x))}return x}function setItems(x){localStorage.setItem('app_items',JSON.stringify(x))}function getTheme(){return Object.assign({},DEFAULT_THEME,JSON.parse(localStorage.getItem('app_theme')||'{}'))}function setTheme(t){localStorage.setItem('app_theme',JSON.stringify(t))}function applyTheme(){const t=getTheme();['bg','card','text','primary','accent','success','danger'].forEach(k=>document.documentElement.style.setProperty('--'+k,t[k]));let b=document.querySelector('[data-brand]');if(b)b.textContent=t.brand}function nav(active){return `<nav class="nav"><a class="${active==='input'?'on':''}" href="index.html">Input</a><a class="${active==='laporan'?'on':''}" href="laporan.html">Laporan</a><a class="${active==='setting'?'on':''}" href="setting.html">Setting</a></nav>`}
navbox.innerHTML=nav('setting');applyTheme();function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}function renderTheme(){let t=getTheme(),fields=[['brand','Nama Brand','text'],['bg','Background','color'],['card','Warna Card','color'],['text','Warna Tulisan','color'],['primary','Warna Utama','color'],['accent','Warna Aksen','color'],['success','Tombol Hijau','color'],['danger','Tombol Merah','color']];themeBox.innerHTML=fields.map(f=>`<label>${f[1]}<input id="th_${f[0]}" type="${f[2]}" value="${esc(t[f[0]])}"></label>`).join('')}function saveTheme(){let t={};['brand','bg','card','text','primary','accent','success','danger'].forEach(k=>t[k]=document.getElementById('th_'+k).value);setTheme(t);applyTheme();alert('Setting warna disimpan')}
function renderLists(){let data=getItems(),html='';[['produk','Penjualan Bubur'],['extra','Extra Topping'],['minuman','Minuman / Lainnya'],['stok','Stok Perlengkapan'],['kurang','Cek Barang Kurang']].forEach(([k,title])=>{html+=`<section class="card"><div class="section-title"><b>${title}</b><span class="pill">${data[k].length} item</span></div>`;data[k].forEach((it,i)=>{let name=typeof it==='string'?it:it.nama,harga=typeof it==='string'?'':it.harga;html+=`<div class="item-card"><div><input value="${esc(name)}" id="name_${k}_${i}"><input style="margin-top:6px" type="number" value="${harga}" id="price_${k}_${i}" placeholder="Harga"></div><div><button class="primary" onclick="saveItem('${k}',${i})">Simpan</button><button class="red" onclick="delItem('${k}',${i})">Hapus</button></div></div>`});html+='</section>'});lists.innerHTML=html}
function addItem(){let data=getItems(),k=kat.value,n=nama.value.trim();if(!n)return alert('Nama item belum diisi');if(k==='stok'||k==='kurang')data[k].push(n);else data[k].push({nama:n,harga:+harga.value||0});setItems(data);nama.value='';harga.value='';renderLists()}function saveItem(k,i){let data=getItems(),n=document.getElementById(`name_${k}_${i}`).value.trim();if(k==='stok'||k==='kurang')data[k][i]=n;else data[k][i]={nama:n,harga:+document.getElementById(`price_${k}_${i}`).value||0};setItems(data);renderLists();alert('Item disimpan')}function delItem(k,i){if(!confirm('Hapus item ini?'))return;let data=getItems();data[k].splice(i,1);setItems(data);renderLists()}function resetDefault(){if(confirm('Reset item dan warna ke bawaan?')){localStorage.removeItem('app_items');localStorage.removeItem('app_theme');location.reload()}}renderTheme();renderLists();</script></body></html>
