<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Setting</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Control Center</p>
        <h1>Setting</h1>
      </div>
      <button class="mini-btn" onclick="resetDefaultSettings()">Default</button>
    </header>

    <main class="wrap">
      <section class="card">
        <h2>Brand</h2>
        <label>Nama Brand<input id="brandInput"></label>
        <label>Nomor WhatsApp Tujuan<input id="waInput" placeholder="628xxxx"></label>
        <button class="btn primary full" onclick="saveBrandSettings()">Simpan Brand</button>
      </section>

      <section class="card">
        <h2>Tambah Menu</h2>
        <div class="two-col">
          <label>Nama<input id="newName" placeholder="Nama item"></label>
          <label>Harga<input id="newPrice" type="number" placeholder="7000"></label>
        </div>
        <label>Kategori
          <select id="newCat">
            <option value="produk">Bubur</option>
            <option value="extra">Extra</option>
            <option value="minuman">Minuman</option>
          </select>
        </label>
        <button class="btn green full" onclick="addMenuItem()">Tambah Item</button>
      </section>

      <section class="card">
        <h2>Daftar Menu</h2>
        <div id="menuEditor" class="editor-list"></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="input.html">Input</a>
    <a href="laporan.html">Laporan</a>
    <a class="active" href="setting.html">Setting</a>
  </nav>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    startSettings();
  </script>
</body>
</html>
