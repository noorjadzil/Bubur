<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setting - Bubur Ayam Bandung Akang Hamzah</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Setting</h1><p>Edit menu, harga, stok, dan nomor WhatsApp.</p></header>
<main class="wrap">
<section class="panel"><label>Nama Brand<input id="brand"></label><label>Nomor WhatsApp tujuan<input id="wa" placeholder="628xxxx"></label><div class="row"><button class="green" onclick="save()">Simpan Setting</button><button class="ghost" onclick="resetAll()">Reset Default</button></div></section>
<section id="box"></section>
</main><div id="nav"></div><script src="db.js"></script><script>
let cfg;
window.onload=async()=>{document.getElementById('nav').innerHTML=nav('setting'); cfg=await getSettings(); brand.value=cfg.brand||''; wa.value=cfg.wa||''; render();}
function render(){ box.innerHTML=['produk','extra','minuman'].map(k=>`<section class="panel"><div class="catHead"><h2>${k==='produk'?'Menu Bubur':k==='extra'?'Extra Topping':'Minuman'}</h2><button class="soft" onclick="addItem('${k}')">Tambah</button></div>${(cfg[k]||[]).map((it,i)=>`<div class="setrow"><button onclick="move('${k}',${i},-1)">↑</button><button onclick="move('${k}',${i},1)">↓</button><input value="${it.nama}" onchange="cfg['${k}'][${i}].nama=this.value"><input type="number" value="${it.harga}" onchange="cfg['${k}'][${i}].harga=Number(this.value)"><button class="danger" onclick="cfg['${k}'].splice(${i},1);render()">Hapus</button></div>`).join('')}</section>`).join('')+`<section class="panel"><div class="catHead"><h2>Stok</h2><button class="soft" onclick="cfg.stok.push('Item Baru');render()">Tambah</button></div>${(cfg.stok||[]).map((n,i)=>`<div class="setrow"><button onclick="moveStok(${i},-1)">↑</button><button onclick="moveStok(${i},1)">↓</button><input value="${n}" onchange="cfg.stok[${i}]=this.value"><span></span><button class="danger" onclick="cfg.stok.splice(${i},1);render()">Hapus</button></div>`).join('')}</section>`}
function addItem(k){cfg[k].push({nama:'Item Baru',harga:0,aktif:true});render()}
function move(k,i,d){const j=i+d;if(j<0||j>=cfg[k].length)return;[cfg[k][i],cfg[k][j]]=[cfg[k][j],cfg[k][i]];render()}
function moveStok(i,d){const j=i+d;if(j<0||j>=cfg.stok.length)return;[cfg.stok[i],cfg.stok[j]]=[cfg.stok[j],cfg.stok[i]];render()}
async function save(){cfg.brand=brand.value;cfg.wa=wa.value.trim();await saveSettings(cfg);alert('Setting tersimpan')}
async function resetAll(){if(confirm('Reset setting ke bawaan?')){cfg=await resetSettings();brand.value=cfg.brand;wa.value=cfg.wa;render()}}
</script></body></html>
