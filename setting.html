<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setting</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Setting</h1><p>Atur nama usaha, item, harga, kategori, dan WhatsApp.</p></header>
<main class="wrap">
  <div class="card"><label>Nama Usaha</label><input id="namaUsaha"><label style="margin-top:9px">Nomor WhatsApp</label><input id="wa" placeholder="08xxxxxxxxxx"><button class="green" style="margin-top:10px;width:100%" onclick="simpanSetting()">Simpan Setting</button></div>
  <div class="card"><div class="section-title"><h2>Tambah Item</h2><span class="pill">Produk baru</span></div><div class="row"><input id="namaBaru" placeholder="Nama item"><input id="hargaBaru" type="number" placeholder="Harga"></div><select id="kategoriBaru" style="margin-top:8px"><option value="produk">Bubur</option><option value="extra">Extra</option><option value="minuman">Minuman</option></select><button class="blue" style="margin-top:9px;width:100%" onclick="tambahItem()">Tambah Item</button></div>
  <div class="card"><div class="section-title"><h2>Daftar Item</h2><span class="pill">Edit langsung</span></div><div id="itemsArea"></div></div>
</main><div id="navbox"></div><script src="db.js"></script><script>
let S;
window.onload=async()=>{S=await getSettings();navbox.innerHTML=nav('setting');namaUsaha.value=S.namaUsaha||'';wa.value=S.wa||'';renderItems()}
function renderItems(){itemsArea.innerHTML=(S.items||[]).map((x,i)=>`<div class="setting-item"><div><label>Nama</label><input value="${x.nama}" onchange="S.items[${i}].nama=this.value"></div><div><label>Harga</label><input type="number" value="${x.harga}" onchange="S.items[${i}].harga=Number(this.value||0)"></div><div><label>Kategori</label><select onchange="S.items[${i}].kategori=this.value"><option value="produk" ${x.kategori==='produk'?'selected':''}>Bubur</option><option value="extra" ${x.kategori==='extra'?'selected':''}>Extra</option><option value="minuman" ${x.kategori==='minuman'?'selected':''}>Minuman</option></select></div><button class="${x.aktif===false?'soft':'red'}" onclick="toggleItem(${i})">${x.aktif===false?'Aktifkan':'Nonaktif'}</button></div>`).join('')}
async function simpanSetting(){S.namaUsaha=namaUsaha.value.trim()||'Kasir Bubur';S.wa=wa.value.trim();await saveSettings(S);alert('Setting tersimpan')}
async function tambahItem(){const nama=namaBaru.value.trim();const harga=Number(hargaBaru.value||0);if(!nama||!harga){alert('Nama dan harga wajib diisi');return}S.items.push({id:uid(),nama,harga,kategori:kategoriBaru.value,aktif:true});namaBaru.value='';hargaBaru.value='';await saveSettings(S);renderItems();alert('Item ditambahkan')}
async function toggleItem(i){S.items[i].aktif=S.items[i].aktif===false?true:false;await saveSettings(S);renderItems()}
</script></body></html>
