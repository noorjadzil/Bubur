<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Input Penjualan</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Kasir Cepat</p>
        <h1>Input Penjualan</h1>
      </div>
      <div class="total-pill" id="grandTotal">Rp 0</div>
    </header>

    <main class="wrap">
      <section class="card sticky-card">
        <div class="two-col">
          <label>Tanggal<input type="date" id="tanggal"></label>
          <label>Catatan<input id="catatan" placeholder="Catatan singkat"></label>
        </div>
      </section>

      <section class="segmented">
        <button class="active" data-tab="produk">Bubur</button>
        <button data-tab="extra">Extra</button>
        <button data-tab="minuman">Minuman</button>
        <button data-tab="stok">Stok</button>
      </section>

      <section id="produk" class="tab-panel"></section>
      <section id="extra" class="tab-panel hidden"></section>
      <section id="minuman" class="tab-panel hidden"></section>
      <section id="stok" class="tab-panel hidden"></section>

      <section class="card">
        <h2>Barang Kurang</h2>
        <div id="kurangBox" class="chip-grid"></div>
      </section>

      <div class="action-bar">
        <button class="btn ghost" onclick="resetForm()">Reset</button>
        <button class="btn primary" onclick="saveReport(false)">Simpan</button>
        <button class="btn green" onclick="saveReport(true)">WA</button>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a class="active" href="input.html">Input</a>
    <a href="laporan.html">Laporan</a>
    <a href="setting.html">Setting</a>
  </nav>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    startInput();
  </script>
</body>
</html>
