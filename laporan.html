<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Laporan</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Dashboard</p>
        <h1>Laporan</h1>
      </div>
      <button class="mini-btn" onclick="exportCSV()">Export</button>
    </header>

    <main class="wrap">
      <section class="card">
        <div class="two-col">
          <label>Dari<input type="date" id="fromDate"></label>
          <label>Sampai<input type="date" id="toDate"></label>
        </div>
        <button class="btn primary full" onclick="renderReports()">Tampilkan</button>
      </section>

      <section class="stats-grid three">
        <article class="stat-card glass"><span>Total</span><strong id="sumTotal">Rp 0</strong></article>
        <article class="stat-card glass"><span>Terjual</span><strong id="sumQty">0</strong></article>
        <article class="stat-card glass"><span>Hari</span><strong id="sumDays">0</strong></article>
      </section>

      <section class="card">
        <h2>Detail Laporan</h2>
        <div id="reportList" class="report-list"></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="input.html">Input</a>
    <a class="active" href="laporan.html">Laporan</a>
    <a href="setting.html">Setting</a>
  </nav>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    startReports();
  </script>
</body>
</html>
