<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan</title><style>
:root{--navy:#0f172a;--blue:#1e3a8a;--sky:#2563eb;--bg:#f4f7fb;--card:#fff;--muted:#64748b;--line:#dbe3ef;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--navy)}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a 55%,#2563eb);color:#fff;padding:24px 16px 72px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;box-shadow:0 16px 40px rgba(15,23,42,.22)}
.hero-inner{max-width:1040px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand h1{margin:0;font-size:25px}.brand p{margin:6px 0 0;color:#dbeafe;font-size:13px}
.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);padding:10px 12px;border-radius:999px;font-weight:800;font-size:13px}.nav a.active,.nav a:hover{background:#fff;color:#1e3a8a}
.wrap{max-width:1040px;margin:-46px auto 40px;padding:0 14px}.card{background:rgba(255,255,255,.96);border:1px solid rgba(226,232,240,.9);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 14px 35px rgba(15,23,42,.09)}
.card h2{margin:0 0 12px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-weight:800;font-size:13px;margin:6px 0;color:#334155}
input,textarea,select{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:14px;padding:12px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.12)}textarea{min-height:84px;resize:vertical}
.table-box{overflow:auto;border-radius:16px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:680px;background:#fff}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}th{background:#eef4ff;color:#1e3a8a;font-weight:900}.left{text-align:left}.num{max-width:120px;text-align:center}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:900;cursor:pointer;color:#fff;background:#1e3a8a;box-shadow:0 10px 18px rgba(30,58,138,.18)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.amber{background:var(--amber)}.btn.light{background:#e2e8f0;color:#0f172a}.btn:active{transform:scale(.99)}
.total{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#ecfeff,#eff6ff);border:1px solid #bfdbfe;border-radius:18px;padding:14px;margin:12px 0}.total b{font-size:24px;color:#1e3a8a}.muted{font-size:12px;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#e0f2fe;color:#075985;padding:6px 10px;font-weight:900;font-size:12px}.empty{padding:18px;text-align:center;color:#64748b;background:#fff;border-radius:16px;border:1px dashed #cbd5e1}.row-actions{display:flex;gap:8px;justify-content:center}.smallbtn{border:0;border-radius:10px;padding:8px 10px;font-weight:900;cursor:pointer}
@media(max-width:720px){.hero-inner{display:block}.nav{margin-top:16px}.grid{grid-template-columns:1fr}.brand h1{font-size:22px}table{min-width:620px}.btn{width:100%}.total{display:block}.total b{display:block;margin-top:6px}}
</style></head><body>
<header class="hero"><div class="hero-inner"><div class="brand"><h1>Menu Laporan</h1><p>Laporan harian, bulanan, dan hapus data agar tidak numpuk</p></div><nav class="nav"><a href="index.html">Input</a><a class="active" href="laporan.html">Laporan</a><a href="setting.html">Setting</a></nav></div></header>
<main class="wrap">
<section class="card"><h2>Laporan Harian</h2><div class="grid"><div><label>Pilih Tanggal</label><input type="date" id="tglHarian"></div><div><label>Aksi</label><button class="btn" onclick="renderHarian()">Tampilkan Harian</button></div></div><div id="hasilHarian" style="margin-top:12px"></div></section>
<section class="card"><h2>Laporan Bulanan</h2><div class="grid"><div><label>Pilih Bulan</label><input type="month" id="bulan"></div><div><label>Aksi</label><button class="btn" onclick="renderBulanan()">Tampilkan Bulanan</button></div></div><div id="hasilBulanan" style="margin-top:12px"></div><div class="btns"><button class="btn red" onclick="hapusBulan()">Hapus Data Bulan Ini</button><button class="btn amber" onclick="hapusSemua()">Hapus Semua Data</button></div></section>
<section class="card"><h2>Semua Data Tersimpan</h2><div id="daftar"></div></section>
</main>
<script>
const DB_NAME="laporan_bubur_indexeddb_v1";
const DB_VERSION=1;
const DEFAULT_SETTINGS={
  produk:[{nama:"Bubur Ori",harga:7000},{nama:"Bubur Cakwe",harga:12000},{nama:"Bubur Telur",harga:12000},{nama:"Bubur Ayam Suwir",harga:15000},{nama:"Bubur Abon",harga:17000},{nama:"Bubur Spesial",harga:13000},{nama:"Bubur Istimewa",harga:17000}],
  extra:[{nama:"Cakwe",harga:2000},{nama:"Ayam Suwir",harga:3000},{nama:"Abon",harga:5000},{nama:"Irisan Telur Dadar",harga:1000},{nama:"Telur Rebus",harga:1000},{nama:"Kuah",harga:500},{nama:"Krupuk",harga:500}],
  minuman:[{nama:"Puyuh",harga:3000},{nama:"Cleo",harga:1000},{nama:"Teh Anget",harga:3000},{nama:"Es Teh",harga:3000}],
  stok:["Paper Bowl","Tali Segel","Sendok","Krupuk","Kripik Pangsit","Bawang Goreng","Kacang Kedelai"],
  kurang:["Cleo","Tisu","Plastik Kecap","Plastik Kuah","Plastik Sambal","Kecap Asin","Kecap Manis","Lada","Kresek Kecil","Kresek Tanggung","Kresek Besar"]
};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("reports"))db.createObjectStore("reports",{keyPath:"tanggal"});if(!db.objectStoreNames.contains("settings"))db.createObjectStore("settings",{keyPath:"key"});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function getOne(store,key){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(store,"readonly");const r=t.objectStore(store).get(key);r.onsuccess=()=>{db.close();res(r.result||null)};r.onerror=()=>{db.close();rej(r.error)}})}
async function putOne(store,val){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(store,"readwrite");t.objectStore(store).put(val);t.oncomplete=()=>{db.close();res(true)};t.onerror=()=>{db.close();rej(t.error)}})}
async function delOne(store,key){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(store,"readwrite");t.objectStore(store).delete(key);t.oncomplete=()=>{db.close();res(true)};t.onerror=()=>{db.close();rej(t.error)}})}
async function allReports(){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction("reports","readonly");const r=t.objectStore("reports").getAll();r.onsuccess=()=>{db.close();res((r.result||[]).sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal))))};r.onerror=()=>{db.close();rej(r.error)}})}
async function getSettings(){let data=await getOne("settings","app");if(!data){data={key:"app",...structuredClone(DEFAULT_SETTINGS)};await putOne("settings",data)}return data}
function rupiah(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function todayID(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}

function sumItems(arr){return (arr||[]).reduce((a,b)=>a+Number(b.total||0),0)}
function rows(title,arr){let html=`<tr><th colspan="4" class="left">${title}</th></tr>`;let ada=false;(arr||[]).forEach(x=>{if(Number(x.jumlah)>0){ada=true;html+=`<tr><td class="left">${esc(x.nama)}</td><td>${rupiah(x.harga)}</td><td>${x.jumlah}</td><td>${rupiah(x.total)}</td></tr>`}});if(!ada)html+=`<tr><td colspan="4" class="left">-</td></tr>`;return html}
async function init(){document.getElementById("tglHarian").value=todayID();document.getElementById("bulan").value=todayID().slice(0,7);await renderHarian();await renderBulanan();await renderDaftar()}
async function renderHarian(){const t=document.getElementById("tglHarian").value;const d=await getOne("reports",t);const el=document.getElementById("hasilHarian");if(!d){el.innerHTML=`<div class="empty">Belum ada data tanggal ${esc(t)}</div>`;return}el.innerHTML=`<span class="pill">${esc(d.tanggal)}</span><div class="table-box" style="margin-top:10px"><table><thead><tr><th>Nama</th><th>Harga</th><th>Jumlah</th><th>Total</th></tr></thead><tbody>${rows("PENJUALAN BUBUR",d.produk)}${rows("EXTRA TOPPING",d.extra)}${rows("MINUMAN / LAINNYA",d.minuman)}</tbody></table></div><div class="total"><span>Total Harian</span><b>${rupiah(d.total)}</b></div><p><b>Catatan:</b> ${esc(d.catatan||"-")}</p><div class="btns"><button class="btn red" onclick="hapusTanggal('${d.tanggal}')">Hapus Tanggal Ini</button></div>`}
async function renderBulanan(){const bulan=document.getElementById("bulan").value;const data=(await allReports()).filter(x=>String(x.tanggal||"").startsWith(bulan));const el=document.getElementById("hasilBulanan");if(!data.length){el.innerHTML=`<div class="empty">Belum ada data bulan ${esc(bulan)}</div>`;return}let total=data.reduce((a,b)=>a+Number(b.total||0),0);let html=`<div class="total"><span>Total Bulan ${esc(bulan)} • ${data.length} hari</span><b>${rupiah(total)}</b></div><div class="table-box"><table><thead><tr><th>Tanggal</th><th>Produk</th><th>Extra</th><th>Minuman</th><th>Total</th><th>Aksi</th></tr></thead><tbody>`;data.sort((a,b)=>String(a.tanggal).localeCompare(String(b.tanggal))).forEach(d=>{html+=`<tr><td>${esc(d.tanggal)}</td><td>${rupiah(sumItems(d.produk))}</td><td>${rupiah(sumItems(d.extra))}</td><td>${rupiah(sumItems(d.minuman))}</td><td><b>${rupiah(d.total)}</b></td><td><button class="smallbtn" onclick="pilihHarian('${d.tanggal}')">Lihat</button></td></tr>`});html+=`</tbody></table></div>`;el.innerHTML=html}
async function renderDaftar(){const data=await allReports();const el=document.getElementById("daftar");if(!data.length){el.innerHTML='<div class="empty">Belum ada data tersimpan.</div>';return}let html='<div class="table-box"><table><thead><tr><th>Tanggal</th><th>Total</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody>';data.forEach(d=>{html+=`<tr><td>${esc(d.tanggal)}</td><td><b>${rupiah(d.total)}</b></td><td class="left">${esc(d.catatan||"-")}</td><td><div class="row-actions"><button class="smallbtn" onclick="pilihHarian('${d.tanggal}')">Lihat</button><button class="smallbtn" onclick="hapusTanggal('${d.tanggal}')">Hapus</button></div></td></tr>`});html+='</tbody></table></div>';el.innerHTML=html}
function pilihHarian(t){document.getElementById("tglHarian").value=t;renderHarian();window.scrollTo({top:0,behavior:"smooth"})}
async function hapusTanggal(t){if(confirm("Hapus data tanggal "+t+"?")){await delOne("reports",t);await renderHarian();await renderBulanan();await renderDaftar()}}
async function hapusBulan(){const bulan=document.getElementById("bulan").value;const data=(await allReports()).filter(x=>String(x.tanggal||"").startsWith(bulan));if(!data.length)return alert("Tidak ada data bulan ini");if(confirm("Hapus semua data bulan "+bulan+"?")){for(const d of data) await delOne("reports",d.tanggal);await renderHarian();await renderBulanan();await renderDaftar();alert("Data bulan ini dihapus")}}
async function hapusSemua(){const data=await allReports();if(!data.length)return alert("Belum ada data");if(confirm("Hapus SEMUA data laporan?")){for(const d of data) await delOne("reports",d.tanggal);await renderHarian();await renderBulanan();await renderDaftar();alert("Semua data laporan dihapus")}}
init();
</script></body></html>
