<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#1e3a8a;--accent:#2563eb;--line:#dbe3ef;--success:#15803d;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px}header{background:linear-gradient(135deg,var(--text),var(--primary));color:white;padding:20px 16px 24px;border-radius:0 0 28px 28px;box-shadow:0 12px 30px #0f172a30}h1{margin:0;font-size:22px}header p{margin:6px 0 0}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 8px 24px #0f172a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.row{display:flex;gap:10px}.row>*{flex:1}label{display:block;font-weight:800;font-size:13px;margin-bottom:8px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;color:var(--text)}button{border:0;border-radius:15px;padding:12px 14px;font-weight:900;cursor:pointer;width:100%;margin-top:8px}.primary{background:var(--primary);color:white}.green{background:var(--success);color:white}.red{background:var(--danger);color:white}.nav{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:9px;z-index:10}.nav a{border-radius:16px;padding:10px 6px;text-align:center;text-decoration:none;font-weight:900;color:var(--muted)}.nav a.on{background:var(--primary);color:white}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.pill{background:#eef2ff;color:var(--primary);padding:6px 10px;border-radius:999px;font-weight:900;font-size:12px}.money{font-size:22px;font-weight:1000;color:var(--primary)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:8px;text-align:center}th{background:#eef2ff}td.left,th.left{text-align:left}.scroll{overflow:auto}.small{font-size:12px;color:var(--muted)}.item-card{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:end;border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0;background:#fff}.item-card b{display:block;margin-bottom:4px}.qty{font-size:18px;font-weight:900;text-align:center}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:520px){.wrap{padding:10px}.card{padding:12px}.item-card{grid-template-columns:1fr 78px}th,td{padding:6px;font-size:12px}}</style></head><body><header><h1>Laporan</h1><p data-brand></p></header><main class="wrap"><section class="card"><div class="grid"><label>Bulan<input type="month" id="bulan"></label><label>Mode<select id="mode"><option value="harian">Harian</option><option value="bulanan">Bulanan 1–31</option></select></label></div><button class="primary" onclick="render()">Tampilkan</button></section><div id="out"></div></main><div id="navbox"></div><script>const DEFAULT_ITEMS={produk:[{nama:'Bubur Ori',harga:7000},{nama:'Bubur Cakwe',harga:12000},{nama:'Bubur Telur',harga:12000},{nama:'Bubur Ayam Suwir',harga:15000},{nama:'Bubur Abon',harga:17000},{nama:'Bubur Spesial',harga:13000},{nama:'Bubur Istimewa',harga:17000}],extra:[{nama:'Cakwe',harga:2000},{nama:'Ayam Suwir',harga:3000},{nama:'Abon',harga:5000},{nama:'Irisan Telur Dadar',harga:1000},{nama:'Telur Rebus',harga:1000},{nama:'Kuah',harga:500},{nama:'Krupuk',harga:500}],minuman:[{nama:'Puyuh',harga:3000},{nama:'Cleo',harga:1000},{nama:'Teh Anget',harga:3000},{nama:'Es Teh',harga:3000}],stok:['Paper Bowl','Tali Segel','Sendok','Krupuk','Kripik Pangsit','Bawang Goreng','Kacang Kedelai'],kurang:['Cleo','Tisu','Plastik Kecap','Plastik Kuah','Plastik Sambal','Kecap Asin','Kecap Manis','Lada','Kresek Kecil','Kresek Tanggung','Kresek Besar']};
const DEFAULT_THEME={brand:'Bubur Ayam Bandung Akang Hamzah',bg:'#f4f7fb',card:'#ffffff',text:'#0f172a',primary:'#1e3a8a',accent:'#2563eb',success:'#15803d',danger:'#b91c1c'};
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}function rp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}function clone(o){return JSON.parse(JSON.stringify(o))}function getItems(){let x=JSON.parse(localStorage.getItem('app_items')||'null');if(!x){x=clone(DEFAULT_ITEMS);localStorage.setItem('app_items',JSON.stringify(x))}return x}function setItems(x){localStorage.setItem('app_items',JSON.stringify(x))}function getTheme(){return Object.assign({},DEFAULT_THEME,JSON.parse(localStorage.getItem('app_theme')||'{}'))}function setTheme(t){localStorage.setItem('app_theme',JSON.stringify(t))}function applyTheme(){const t=getTheme();['bg','card','text','primary','accent','success','danger'].forEach(k=>document.documentElement.style.setProperty('--'+k,t[k]));let b=document.querySelector('[data-brand]');if(b)b.textContent=t.brand}function nav(active){return `<nav class="nav"><a class="${active==='input'?'on':''}" href="index.html">Input</a><a class="${active==='laporan'?'on':''}" href="laporan.html">Laporan</a><a class="${active==='setting'?'on':''}" href="setting.html">Setting</a></nav>`}
navbox.innerHTML=nav('laporan');applyTheme();bulan.value=today().slice(0,7);function getDayData(date){let v=JSON.parse(localStorage.getItem('laporan_'+date)||'[]');return Array.isArray(v)?v:(v?[v]:[])}function flat(d){return [...(d.produk||[]),...(d.extra||[]),...(d.minuman||[])]}function render(){mode.value==='harian'?renderHarian():renderBulanan()}
function renderHarian(){let ym=bulan.value,last=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate(),html='',grand=0;for(let day=1;day<=last;day++){let date=ym+'-'+String(day).padStart(2,'0'),arr=getDayData(date),total=arr.reduce((a,b)=>a+(+b.total||0),0);grand+=total;html+=`<section class="card"><div class="section-title"><b>Tanggal ${day}</b><span class="pill">${rp(total)}</span></div>`;if(!arr.length)html+='<div class="empty">Belum ada data</div>';else arr.forEach((d,idx)=>{let rows=flat(d).filter(x=>x.jumlah>0).map(x=>`<tr><td class="left">${x.nama}</td><td>${x.jumlah}</td><td>${rp(x.total)}</td></tr>`).join('')||'<tr><td colspan="3">Kosong</td></tr>';html+=`<div class="card" style="box-shadow:none"><b>Transaksi ${idx+1}</b><div class="small">${d.waktu||''}</div><div class="scroll"><table><tr><th class="left">Item</th><th>Qty</th><th>Total</th></tr>${rows}</table></div><p><b>Total:</b> ${rp(d.total)}</p></div>`});html+='</section>'}out.innerHTML=`<section class="card"><div class="section-title"><b>Total Bulan Ini</b><div class="money">${rp(grand)}</div></div></section>`+html}
function renderBulanan(){let ym=bulan.value,last=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate(),map={};let all=getItems();all.produk.concat(all.extra,all.minuman).forEach(i=>map[i.nama]={harga:i.harga,days:Array(31).fill(0),totalQty:0,totalRp:0});for(let day=1;day<=last;day++){let date=ym+'-'+String(day).padStart(2,'0');getDayData(date).forEach(d=>flat(d).forEach(x=>{if(!map[x.nama])map[x.nama]={harga:x.harga,days:Array(31).fill(0),totalQty:0,totalRp:0};map[x.nama].days[day-1]+=+x.jumlah||0;map[x.nama].totalQty+=+x.jumlah||0;map[x.nama].totalRp+=+x.total||0}))}let heads=Array.from({length:31},(_,i)=>`<th>${i+1}</th>`).join('');let rows=Object.entries(map).map(([n,m])=>`<tr><td class="left"><b>${n}</b><br><span class="small">${rp(m.harga)}</span></td>${m.days.map((v,i)=>`<td${i>=last?' style="background:#f1f5f9;color:#aaa"':''}>${v||''}</td>`).join('')}<td><b>${m.totalQty}</b></td><td><b>${rp(m.totalRp)}</b></td></tr>`).join('');let total=Object.values(map).reduce((a,b)=>a+b.totalRp,0);out.innerHTML=`<section class="card"><div class="section-title"><b>Rekap Bulanan Lengkap Tanggal 1–31</b><div class="money">${rp(total)}</div></div><div class="scroll"><table><tr><th class="left">Item</th>${heads}<th>Total Qty</th><th>Total Uang</th></tr>${rows}</table></div><p class="small">Tanggal 1–31 tetap terlihat. Untuk bulan yang tidak sampai 31, kolom sisanya abu-abu.</p></section>`}render();</script></body></html>
