<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan - Bubur Ayam Bandung Akang Hamzah</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1>Laporan</h1><p>Harian dan bulanan dari IndexedDB</p></header>
<main class="wrap">
<section class="panel"><div class="grid3"><label>Dari<input type="date" id="from"></label><label>Sampai<input type="date" id="to"></label><button class="primary" onclick="renderReports()">Tampilkan</button></div></section>
<section id="summary" class="dash"></section>
<section id="list"></section>
</main><div id="nav"></div><script src="db.js"></script><script>
window.onload=()=>{document.getElementById('nav').innerHTML=nav('laporan'); from.value=today().slice(0,8)+'01'; to.value=today(); renderReports();}
async function renderReports(){
  const all=(await getAllReports()).filter(r=>r.tanggal>=from.value&&r.tanggal<=to.value);
  const total=all.reduce((a,b)=>a+Number(b.total||0),0);
  summary.innerHTML=`<div><span>Total Range</span><b>${rupiah(total)}</b></div><div><span>Jumlah Transaksi</span><b>${all.length}</b></div><div><span>Rata-rata</span><b>${rupiah(all.length?total/all.length:0)}</b></div>`;
  list.innerHTML=all.map(r=>`<article class="panel"><div class="catHead"><h2>${r.tanggal}</h2><b>${rupiah(r.total)}</b></div>${['produk','extra','minuman'].map(k=>`<details open><summary><b>${k==='produk'?'Bubur':k==='extra'?'Extra':'Minuman'}</b></summary><table><tbody>${(r[k]||[]).filter(i=>Number(i.jumlah)>0).map(i=>`<tr><td>${i.nama} x ${i.jumlah}</td><td>${rupiah(i.jumlah*i.harga)}</td></tr>`).join('')||'<tr><td colspan="2">Tidak ada data</td></tr>'}</tbody></table></details>`).join('')}${r.catatan?`<p class="muted">Catatan: ${r.catatan}</p>`:''}<button class="danger" onclick="del('${r.id}')">Hapus</button></article>`).join('')||'<div class="panel">Belum ada data pada tanggal ini.</div>';
}
async function del(id){if(confirm('Hapus laporan ini?')){await deleteReport(id);renderReports()}}
</script></body></html>
