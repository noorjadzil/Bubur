<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubur Ayam Bandung Akang Hamzah</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
:root{
  --navy:#07111f;--navy2:#0f172a;--blue:#1e3a8a;--sky:#2563eb;--gold:#fbbf24;
  --bg:#eef3fb;--card:#ffffff;--muted:#64748b;--line:#d9e2ef;--green:#16a34a;--red:#dc2626;
  --shadow:0 20px 50px rgba(15,23,42,.12);--soft:0 8px 24px rgba(15,23,42,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:
radial-gradient(circle at top left,#dbeafe 0,#eef3fb 30%,#f8fafc 100%);color:var(--navy2);padding-bottom:88px}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:#93c5fd;box-shadow:0 0 0 4px #dbeafe}
.hero{position:sticky;top:0;z-index:20;color:white;padding:18px 16px 20px;background:
linear-gradient(135deg,#07111f,#0f172a 45%,#1e3a8a);box-shadow:0 18px 40px rgba(15,23,42,.25)}
.hero:after{content:"";position:absolute;inset:auto 18px -18px 18px;height:38px;border-radius:999px;background:rgba(59,130,246,.22);filter:blur(16px);z-index:-1}
.brand{max-width:940px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.logo{width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,#fbbf24,#fff,#60a5fa);display:grid;place-items:center;color:#0f172a;font-weight:1000;box-shadow:0 16px 30px rgba(251,191,36,.25)}
.hero h1{font-size:18px;margin:0;font-weight:950;letter-spacing:-.4px}
.hero p{margin:3px 0 0;color:#dbeafe;font-size:12px}
.badge{font-size:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:7px 10px;border-radius:999px;white-space:nowrap}
.wrap{max-width:940px;margin:auto;padding:14px}
.stats{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;margin-top:4px}
.stat{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:14px;box-shadow:var(--soft)}
.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:24px;font-weight:1000;letter-spacing:-.7px;margin-top:4px}
.card{background:rgba(255,255,255,.94);border:1px solid rgba(226,232,240,.95);border-radius:26px;padding:16px;margin:12px 0;box-shadow:var(--soft)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-title h2{font-size:16px;margin:0;font-weight:950}
.pill{font-size:11px;color:#1e3a8a;background:#dbeafe;border:1px solid #bfdbfe;padding:6px 9px;border-radius:999px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{font-weight:850;font-size:12px;color:#334155}
.item{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;padding:10px;border:1px solid #e2e8f0;border-radius:20px;margin:8px 0;background:linear-gradient(180deg,#fff,#f8fafc)}
.item-name{font-weight:950;font-size:14px}.price{font-size:12px;color:var(--muted);margin-top:3px}
.qty{display:grid;grid-template-columns:34px 1fr 34px;gap:6px;align-items:center}
.qty button{height:36px;border-radius:13px;background:#e0edff;color:#1e3a8a;font-weight:1000}
.qty input{text-align:center;padding:9px;border-radius:13px;font-weight:900}
.subtotal{font-size:12px;color:#16a34a;font-weight:900;margin-top:4px}
.actions{position:sticky;bottom:76px;z-index:15;background:rgba(238,243,251,.84);backdrop-filter:blur(10px);padding:10px;border-radius:24px;border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}
.row{display:flex;gap:10px}
.btn{width:100%;padding:13px 14px;border-radius:18px;font-weight:950;box-shadow:0 10px 22px rgba(15,23,42,.10)}
.primary{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:white}.green{background:linear-gradient(135deg,#15803d,#22c55e);color:white}.red{background:#fee2e2;color:#991b1b}.ghost{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid #e2e8f0;padding:8px 10px env(safe-area-inset-bottom)}
.nav-inner{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nav button{border-radius:18px;padding:10px 6px;background:transparent;color:#64748b;font-size:12px;font-weight:900}
.nav button.active{background:#0f172a;color:white;box-shadow:0 12px 22px rgba(15,23,42,.18)}
.page{display:none}.page.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.table-wrap{overflow:auto;border-radius:18px;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;background:white;font-size:13px}
th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}
th{background:#f1f5f9;color:#334155}.right{text-align:right}.center{text-align:center}
.empty{padding:24px;text-align:center;color:#64748b}
.small{font-size:12px;color:#64748b}.danger{color:#b91c1c}
.setting-row{display:grid;grid-template-columns:1fr 88px 42px;gap:8px;margin:8px 0;align-items:center}
.setting-row button{height:42px;border-radius:14px;background:#fee2e2;color:#991b1b;font-weight:1000}
.toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:60;background:#0f172a;color:white;padding:11px 14px;border-radius:999px;box-shadow:var(--shadow);font-weight:850;display:none}
@media(max-width:520px){.wrap{padding:10px}.stats{grid-template-columns:1fr 1fr}.stat .value{font-size:20px}.grid2,.grid3{grid-template-columns:1fr}.item{grid-template-columns:1fr}.row{flex-direction:column}.hero h1{font-size:16px}.badge{display:none}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<header class="hero">
  <div class="brand">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="logo">AH</div>
      <div>
        <h1 id="brandTitle">Bubur Ayam Bandung Akang Hamzah</h1>
        <p>Premium Daily Sales System</p>
      </div>
    </div>
    <div class="badge">EXCLUSIVE POS</div>
  </div>
</header>

<main class="wrap">
  <section class="stats">
    <div class="stat"><div class="label">Total hari ini</div><div class="value" id="topTotal">Rp 0</div></div>
    <div class="stat"><div class="label">Item terisi</div><div class="value" id="topItems">0</div></div>
  </section>

  <section id="pageInput" class="page active">
    <div class="card">
      <div class="section-title"><h2>Data Laporan</h2><span class="pill" id="saveStatus">Siap</span></div>
      <div class="grid2">
        <label>Tanggal<input type="date" id="tanggal"></label>
        <label>Catatan<textarea id="catatan" rows="1" placeholder="Contoh: setor, kurang, tambahan stok..."></textarea></label>
      </div>
    </div>
    <div id="inputArea"></div>
    <div class="actions">
      <div class="row">
        <button class="btn primary" onclick="simpan()">Simpan</button>
        <button class="btn green" onclick="kirimWA()">Kirim WhatsApp</button>
        <button class="btn red" onclick="hapusData()">Hapus Hari Ini</button>
      </div>
    </div>
  </section>

  <section id="pageLaporan" class="page">
    <div class="card">
      <div class="section-title"><h2>Laporan</h2><span class="pill">Harian & Bulanan</span></div>
      <div class="grid3">
        <label>Dari<input type="date" id="fromDate"></label>
        <label>Sampai<input type="date" id="toDate"></label>
        <button class="btn primary" onclick="renderLaporan()">Tampilkan</button>
      </div>
    </div>
    <div id="laporanArea"></div>
  </section>

  <section id="pageSetting" class="page">
    <div class="card">
      <div class="section-title"><h2>Setting Brand</h2><span class="pill">Data asli dipertahankan</span></div>
      <label>Nama Brand<input id="brandInput"></label>
      <label>Nomor WhatsApp Tujuan<input id="waInput" placeholder="628xxxx, kosong = pilih kontak WhatsApp"></label>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" onclick="saveSettings()">Simpan Setting</button>
        <button class="btn ghost" onclick="resetMenuDefault()">Reset Menu Asli</button>
      </div>
    </div>
    <div id="settingArea"></div>
  </section>
</main>

<nav class="nav"><div class="nav-inner">
  <button class="active" onclick="showPage('Input',this)">Input</button>
  <button onclick="showPage('Laporan',this)">Laporan</button>
  <button onclick="showPage('Setting',this)">Setting</button>
</div></nav>

<script>
const DEFAULT_MENU = {
  brand:"Bubur Ayam Bandung Akang Hamzah",
  wa:"",
  produk:[
    { nama:"Bubur Ori", harga:7000 },
    { nama:"Bubur Cakwe", harga:12000 },
    { nama:"Bubur Telur", harga:12000 },
    { nama:"Bubur Ayam Suwir", harga:15000 },
    { nama:"Bubur Abon", harga:17000 },
    { nama:"Bubur Spesial", harga:13000 },
    { nama:"Bubur Istimewa", harga:17000 }
  ],
  extra:[
    { nama:"Cakwe", harga:2000 },
    { nama:"Ayam Suwir", harga:3000 },
    { nama:"Abon", harga:5000 },
    { nama:"Irisan Telur Dadar", harga:1000 },
    { nama:"Telur Rebus", harga:1000 },
    { nama:"Kuah", harga:500 },
    { nama:"Krupuk", harga:500 }
  ],
  minuman:[
    { nama:"Puyuh", harga:3000 },
    { nama:"Cleo", harga:1000 },
    { nama:"Teh Anget", harga:3000 },
    { nama:"Es Teh", harga:3000 }
  ],
  stok:["Paper Bowl","Tali Segel","Sendok","Krupuk","Kripik Pangsit","Bawang Goreng","Kacang Kedelai"],
  kurang:["Cleo","Tisu","Plastik Kecap","Plastik Kuah","Plastik Sambal","Kecap Asin","Kecap Manis","Lada","Kresek Kecil","Kresek Tanggung","Kresek Besar"]
};
let cfg = loadCfg();
let autosaveTimer;

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadCfg(){
  const saved = JSON.parse(localStorage.getItem("app_menu_premium_akang")||"null");
  if(!saved) return clone(DEFAULT_MENU);
  return {...clone(DEFAULT_MENU),...saved};
}
function persistCfg(){localStorage.setItem("app_menu_premium_akang",JSON.stringify(cfg))}
function rupiah(n){return "Rp " + Number(n||0).toLocaleString("id-ID")}
function today(){return new Date().toISOString().slice(0,10)}
function toast(msg){const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",1800)}
function showPage(name,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page"+name).classList.add("active");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  if(name==="Laporan") renderLaporan();
  if(name==="Setting") renderSetting();
}
function init(){
  tanggal.value = localStorage.getItem("lastTanggalAkang") || today();
  fromDate.value = tanggal.value.slice(0,8)+"01";
  toDate.value = tanggal.value;
  brandTitle.textContent=cfg.brand;
  brandInput.value=cfg.brand; waInput.value=cfg.wa||"";
  renderInput(); muatData(); hitung(); renderSetting();
  tanggal.addEventListener("change",()=>{localStorage.setItem("lastTanggalAkang",tanggal.value); resetFormOnly(); muatData(); hitung()});
  catatan.addEventListener("input",autoSave);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
function renderInput(){
  inputArea.innerHTML="";
  renderBarangSection("Penjualan Bubur","produk",cfg.produk);
  renderBarangSection("Extra Topping / Tambahan","extra",cfg.extra);
  renderBarangSection("Minuman / Lainnya","minuman",cfg.minuman);
  renderStokSection();
  renderKurangSection();
}
function renderBarangSection(title,prefix,data){
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<div class="section-title"><h2>${title}</h2><span class="pill">${data.length} item</span></div><div id="${prefix}List"></div>`;
  inputArea.appendChild(card);
  const list=card.querySelector("#"+prefix+"List");
  data.forEach((it,i)=>{
    const div=document.createElement("div"); div.className="item";
    div.innerHTML=`<div><div class="item-name">${it.nama}</div><div class="price">${rupiah(it.harga)}</div><div class="subtotal" id="${prefix}_total_${i}">Rp 0</div></div>
    <div class="qty"><button onclick="stepQty('${prefix}',${i},-1)">−</button><input type="number" min="0" id="${prefix}_jumlah_${i}" value="0" oninput="hitung();autoSave()"><button onclick="stepQty('${prefix}',${i},1)">+</button></div>`;
    list.appendChild(div);
  });
}
function renderStokSection(){
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<div class="section-title"><h2>Stok Perlengkapan</h2><span class="pill">Awal - Laku = Sisa</span></div><div id="stokList"></div>`;
  inputArea.appendChild(card);
  cfg.stok.forEach((nama,i)=>{
    const div=document.createElement("div"); div.className="item";
    div.innerHTML=`<div><div class="item-name">${nama}</div><div class="subtotal" id="stok_sisa_${i}">Sisa 0</div></div>
    <div class="grid2"><input type="number" id="stok_awal_${i}" value="0" placeholder="Awal" oninput="hitungStok(${i});autoSave()"><input type="number" id="stok_laku_${i}" value="0" placeholder="Laku" oninput="hitungStok(${i});autoSave()"></div>`;
    card.querySelector("#stokList").appendChild(div);
  });
}
function renderKurangSection(){
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<div class="section-title"><h2>Kekurangan / Catatan Barang</h2><span class="pill">Checklist</span></div><div id="kurangList"></div>`;
  inputArea.appendChild(card);
  cfg.kurang.forEach((nama,i)=>{
    const div=document.createElement("div"); div.className="item";
    div.innerHTML=`<div class="item-name">${nama}</div><div class="grid2"><label><input type="checkbox" id="kurang_${i}" onchange="autoSave()"> Kurang</label><label><input type="checkbox" id="cukup_${i}" onchange="autoSave()"> Cukup</label></div>`;
    card.querySelector("#kurangList").appendChild(div);
  });
}
function stepQty(prefix,i,delta){const el=document.getElementById(`${prefix}_jumlah_${i}`); el.value=Math.max(0,Number(el.value||0)+delta); hitung(); autoSave(); if(navigator.vibrate) navigator.vibrate(10)}
function hitung(){
  let total=0, filled=0;
  total += hitungBarang(cfg.produk,"produk");
  total += hitungBarang(cfg.extra,"extra");
  total += hitungBarang(cfg.minuman,"minuman");
  ["produk","extra","minuman"].forEach(prefix=>{
    const arr=cfg[prefix]; arr.forEach((_,i)=>{ if(Number(document.getElementById(`${prefix}_jumlah_${i}`)?.value||0)>0) filled++ })
  });
  topTotal.textContent=rupiah(total); topItems.textContent=filled;
}
function hitungBarang(data,prefix){
  let total=0; data.forEach((it,i)=>{const j=Number(document.getElementById(`${prefix}_jumlah_${i}`)?.value||0); const sub=j*it.harga; total+=sub; const e=document.getElementById(`${prefix}_total_${i}`); if(e)e.textContent=rupiah(sub)}); return total;
}
function hitungStok(i){const awal=Number(document.getElementById(`stok_awal_${i}`).value||0); const laku=Number(document.getElementById(`stok_laku_${i}`).value||0); document.getElementById(`stok_sisa_${i}`).textContent="Sisa "+(awal-laku)}
function ambilBarang(data,prefix){return data.map((it,i)=>{const jumlah=Number(document.getElementById(`${prefix}_jumlah_${i}`)?.value||0); return {nama:it.nama,harga:it.harga,jumlah,total:jumlah*it.harga}})}
function ambilStok(){return cfg.stok.map((nama,i)=>{const awal=Number(document.getElementById(`stok_awal_${i}`)?.value||0); const laku=Number(document.getElementById(`stok_laku_${i}`)?.value||0); return {nama,stokAwal:awal,stokLaku:laku,sisa:awal-laku}})}
function ambilKurang(){return cfg.kurang.map((nama,i)=>({nama,kurang:!!document.getElementById(`kurang_${i}`)?.checked,cukup:!!document.getElementById(`cukup_${i}`)?.checked}))}
function buatData(){
  const produk=ambilBarang(cfg.produk,"produk"), extra=ambilBarang(cfg.extra,"extra"), minuman=ambilBarang(cfg.minuman,"minuman");
  const total=[...produk,...extra,...minuman].reduce((a,b)=>a+b.total,0);
  return {tanggal:tanggal.value,catatan:catatan.value,produk,extra,minuman,stok:ambilStok(),kurang:ambilKurang(),total,waktuSimpan:new Date().toISOString()};
}
function simpan(silent=false){
  const data=buatData();
  localStorage.setItem("laporan_"+data.tanggal,JSON.stringify(data));
  saveStatus.textContent="Tersimpan"; if(!silent) toast("Laporan berhasil disimpan");
}
function autoSave(){clearTimeout(autosaveTimer); saveStatus.textContent="Menyimpan..."; autosaveTimer=setTimeout(()=>simpan(true),500)}
function resetFormOnly(){
  catatan.value="";
  document.querySelectorAll('#pageInput input[type="number"]').forEach(i=>i.value=0);
  document.querySelectorAll('#pageInput input[type="checkbox"]').forEach(i=>i.checked=false);
  cfg.stok.forEach((_,i)=>{const e=document.getElementById(`stok_sisa_${i}`); if(e)e.textContent="Sisa 0"});
}
function muatData(){
  const data=JSON.parse(localStorage.getItem("laporan_"+tanggal.value)||"null");
  if(!data){saveStatus.textContent="Belum ada data"; return}
  catatan.value=data.catatan||"";
  isiBarang(data.produk,"produk"); isiBarang(data.extra,"extra"); isiBarang(data.minuman,"minuman");
  data.stok?.forEach((it,i)=>{if(document.getElementById(`stok_awal_${i}`)){document.getElementById(`stok_awal_${i}`).value=it.stokAwal||0;document.getElementById(`stok_laku_${i}`).value=it.stokLaku||0;hitungStok(i)}});
  data.kurang?.forEach((it,i)=>{if(document.getElementById(`kurang_${i}`)){document.getElementById(`kurang_${i}`).checked=!!it.kurang;document.getElementById(`cukup_${i}`).checked=!!it.cukup}});
  saveStatus.textContent="Data dimuat";
}
function isiBarang(data,prefix){data?.forEach((it,i)=>{const e=document.getElementById(`${prefix}_jumlah_${i}`); if(e)e.value=it.jumlah||0})}
function kirimWA(){
  simpan(true); const data=buatData(); let teks=`*LAPORAN PENJUALAN HARIAN*\n*${cfg.brand}*\nTanggal: ${data.tanggal}\n\n`;
  teks += `*PENJUALAN BUBUR*\n${buatTeksBarang(data.produk)}\n*EXTRA TOPPING*\n${buatTeksBarang(data.extra)}\n*MINUMAN / LAINNYA*\n${buatTeksBarang(data.minuman)}\n`;
  teks += `*STOK PERLENGKAPAN*\n`; data.stok.forEach(it=>{if(it.stokAwal||it.stokLaku) teks+=`${it.nama}: awal ${it.stokAwal}, laku ${it.stokLaku}, sisa ${it.sisa}\n`});
  teks += `\n*BARANG KURANG*\n`; let ada=false; data.kurang.forEach(it=>{if(it.kurang){ada=true; teks+=`- ${it.nama}\n`}}); if(!ada) teks+="-\n";
  teks += `\n*TOTAL SEMUA: ${rupiah(data.total)}*`; if(data.catatan) teks+=`\n\nCatatan:\n${data.catatan}`;
  const nomor=(cfg.wa||"").replace(/\D/g,""); window.open(`https://wa.me/${nomor}?text=`+encodeURIComponent(teks),"_blank");
}
function buatTeksBarang(data){let t=""; data.forEach(it=>{if(it.jumlah>0)t+=`${it.nama} x${it.jumlah} = ${rupiah(it.total)}\n`}); return t||"-\n"}
function hapusData(){if(confirm("Hapus data tanggal ini?")){localStorage.removeItem("laporan_"+tanggal.value); resetFormOnly(); hitung(); toast("Data hari ini dihapus")}}
function getAllReports(){
  const arr=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith("laporan_")){try{arr.push(JSON.parse(localStorage.getItem(k)))}catch(e){}}}
  return arr.sort((a,b)=>(b.tanggal||"").localeCompare(a.tanggal||""));
}
function renderLaporan(){
  const from=fromDate.value||"0000-00-00", to=toDate.value||"9999-99-99";
  const data=getAllReports().filter(x=>x.tanggal>=from&&x.tanggal<=to);
  const total=data.reduce((a,b)=>a+Number(b.total||0),0);
  let html=`<div class="card"><div class="section-title"><h2>Ringkasan</h2><span class="pill">${data.length} hari</span></div><div class="stats"><div class="stat"><div class="label">Total periode</div><div class="value">${rupiah(total)}</div></div><div class="stat"><div class="label">Rata-rata</div><div class="value">${rupiah(data.length?total/data.length:0)}</div></div></div></div>`;
  html+=`<div class="card"><div class="section-title"><h2>Daftar Laporan</h2><span class="pill">${from} — ${to}</span></div>`;
  if(!data.length) html+=`<div class="empty">Belum ada laporan pada periode ini.</div>`;
  else{html+=`<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th class="right">Total</th><th>Catatan</th></tr></thead><tbody>`; data.forEach(d=>html+=`<tr><td>${d.tanggal}</td><td class="right"><b>${rupiah(d.total)}</b></td><td>${d.catatan||"-"}</td></tr>`); html+=`</tbody></table></div>`}
  html+=`</div>`; laporanArea.innerHTML=html;
}
function renderSetting(){
  brandInput.value=cfg.brand; waInput.value=cfg.wa||"";
  settingArea.innerHTML="";
  settingSection("Penjualan Bubur","produk");
  settingSection("Extra Topping / Tambahan","extra");
  settingSection("Minuman / Lainnya","minuman");
  settingList("Stok Perlengkapan","stok");
  settingList("Kekurangan / Catatan Barang","kurang");
}
function settingSection(title,key){
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<div class="section-title"><h2>${title}</h2><button class="pill" onclick="addMenuItem('${key}')">+ Tambah</button></div><div id="set_${key}"></div>`;
  settingArea.appendChild(card); const box=card.querySelector("#set_"+key);
  cfg[key].forEach((it,i)=>{box.innerHTML+=`<div class="setting-row"><input value="${escapeHtml(it.nama)}" onchange="cfg.${key}[${i}].nama=this.value;persistCfg();renderInput()"><input type="number" value="${it.harga}" onchange="cfg.${key}[${i}].harga=Number(this.value||0);persistCfg();renderInput()"><button onclick="cfg.${key}.splice(${i},1);persistCfg();renderSetting();renderInput()">×</button></div>`});
}
function settingList(title,key){
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<div class="section-title"><h2>${title}</h2><button class="pill" onclick="addListItem('${key}')">+ Tambah</button></div><div id="set_${key}"></div>`;
  settingArea.appendChild(card); const box=card.querySelector("#set_"+key);
  cfg[key].forEach((nama,i)=>{box.innerHTML+=`<div class="setting-row" style="grid-template-columns:1fr 42px"><input value="${escapeHtml(nama)}" onchange="cfg.${key}[${i}]=this.value;persistCfg();renderInput()"><button onclick="cfg.${key}.splice(${i},1);persistCfg();renderSetting();renderInput()">×</button></div>`});
}
function addMenuItem(key){cfg[key].push({nama:"Item Baru",harga:0});persistCfg();renderSetting();renderInput()}
function addListItem(key){cfg[key].push("Item Baru");persistCfg();renderSetting();renderInput()}
function saveSettings(){cfg.brand=brandInput.value||DEFAULT_MENU.brand;cfg.wa=waInput.value||"";persistCfg();brandTitle.textContent=cfg.brand;toast("Setting disimpan")}
function resetMenuDefault(){if(confirm("Reset menu ke data asli Bubur Ori, Extra, Minuman, Stok, Kekurangan?")){cfg=clone(DEFAULT_MENU);persistCfg();brandTitle.textContent=cfg.brand;renderInput();renderSetting();toast("Menu asli dikembalikan")}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
init();
</script>
</body>
</html>
