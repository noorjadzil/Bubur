<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Penjualan</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#1e3a8a;--accent:#2563eb;--line:#dbe3ef;--success:#15803d;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px}header{background:linear-gradient(135deg,var(--text),var(--primary));color:white;padding:20px 16px 24px;border-radius:0 0 28px 28px;box-shadow:0 12px 30px #0f172a30}h1{margin:0;font-size:22px}header p{margin:6px 0 0}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 8px 24px #0f172a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.row{display:flex;gap:10px}.row>*{flex:1}label{display:block;font-weight:800;font-size:13px;margin-bottom:8px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;color:var(--text)}button{border:0;border-radius:15px;padding:12px 14px;font-weight:900;cursor:pointer;width:100%;margin-top:8px}.primary{background:var(--primary);color:white}.green{background:var(--success);color:white}.red{background:var(--danger);color:white}.nav{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:9px;z-index:10}.nav a{border-radius:16px;padding:10px 6px;text-align:center;text-decoration:none;font-weight:900;color:var(--muted)}.nav a.on{background:var(--primary);color:white}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.pill{background:#eef2ff;color:var(--primary);padding:6px 10px;border-radius:999px;font-weight:900;font-size:12px}.money{font-size:22px;font-weight:1000;color:var(--primary)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:8px;text-align:center}th{background:#eef2ff}td.left,th.left{text-align:left}.scroll{overflow:auto}.small{font-size:12px;color:var(--muted)}.item-card{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:end;border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0;background:#fff}.item-card b{display:block;margin-bottom:4px}.qty{font-size:18px;font-weight:900;text-align:center}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:520px){.wrap{padding:10px}.card{padding:12px}.item-card{grid-template-columns:1fr 78px}th,td{padding:6px;font-size:12px}}</style></head><body><header><h1>Input Penjualan</h1><p data-brand></p></header><main class="wrap"><section class="card"><div class="grid"><label>Tanggal<input type="date" id="tanggal"></label><label>Catatan<input id="catatan" placeholder="Catatan transaksi"></label></div></section><div id="area"></div><section class="card"><div class="section-title"><b>Total Semua</b><div class="money" id="grand">Rp 0</div></div><div class="row"><button class="primary" onclick="simpan()">Simpan</button><button class="green" onclick="kirimWA()">Simpan & Kirim WA</button></div><button class="red" onclick="resetForm()">Reset Input</button><p class="small">Setelah simpan, jumlah otomatis kembali 0 agar siap transaksi berikutnya.</p></section></main><div id="navbox"></div><script>const DEFAULT_ITEMS={produk:[{nama:'Bubur Ori',harga:7000},{nama:'Bubur Cakwe',harga:12000},{nama:'Bubur Telur',harga:12000},{nama:'Bubur Ayam Suwir',harga:15000},{nama:'Bubur Abon',harga:17000},{nama:'Bubur Spesial',harga:13000},{nama:'Bubur Istimewa',harga:17000}],extra:[{nama:'Cakwe',harga:2000},{nama:'Ayam Suwir',harga:3000},{nama:'Abon',harga:5000},{nama:'Irisan Telur Dadar',harga:1000},{nama:'Telur Rebus',harga:1000},{nama:'Kuah',harga:500},{nama:'Krupuk',harga:500}],minuman:[{nama:'Puyuh',harga:3000},{nama:'Cleo',harga:1000},{nama:'Teh Anget',harga:3000},{nama:'Es Teh',harga:3000}],stok:['Paper Bowl','Tali Segel','Sendok','Krupuk','Kripik Pangsit','Bawang Goreng','Kacang Kedelai'],kurang:['Cleo','Tisu','Plastik Kecap','Plastik Kuah','Plastik Sambal','Kecap Asin','Kecap Manis','Lada','Kresek Kecil','Kresek Tanggung','Kresek Besar']};
const DEFAULT_THEME={brand:'Bubur Ayam Bandung Akang Hamzah',bg:'#f4f7fb',card:'#ffffff',text:'#0f172a',primary:'#1e3a8a',accent:'#2563eb',success:'#15803d',danger:'#b91c1c'};
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}function rp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}function clone(o){return JSON.parse(JSON.stringify(o))}function getItems(){let x=JSON.parse(localStorage.getItem('app_items')||'null');if(!x){x=clone(DEFAULT_ITEMS);localStorage.setItem('app_items',JSON.stringify(x))}return x}function setItems(x){localStorage.setItem('app_items',JSON.stringify(x))}function getTheme(){return Object.assign({},DEFAULT_THEME,JSON.parse(localStorage.getItem('app_theme')||'{}'))}function setTheme(t){localStorage.setItem('app_theme',JSON.stringify(t))}function applyTheme(){const t=getTheme();['bg','card','text','primary','accent','success','danger'].forEach(k=>document.documentElement.style.setProperty('--'+k,t[k]));let b=document.querySelector('[data-brand]');if(b)b.textContent=t.brand}function nav(active){return `<nav class="nav"><a class="${active==='input'?'on':''}" href="index.html">Input</a><a class="${active==='laporan'?'on':''}" href="laporan.html">Laporan</a><a class="${active==='setting'?'on':''}" href="setting.html">Setting</a></nav>`}
let items=getItems();tanggal.value=today();navbox.innerHTML=nav('input');applyTheme();
function render(){let html='';[['produk','Penjualan Bubur'],['extra','Extra Topping'],['minuman','Minuman / Lainnya']].forEach(([key,title])=>{html+=`<section class="card"><div class="section-title"><b>${title}</b><span class="pill">${items[key].length} item</span></div>`;items[key].forEach((it,i)=>html+=`<div class="item-card"><div><b>${it.nama}</b><span class="small">${rp(it.harga)} × jumlah</span></div><input class="qty" type="number" min="0" value="0" id="${key}_${i}" oninput="hitung()"></div>`);html+='</section>'});html+=`<section class="card"><b>Stok Perlengkapan</b><div class="grid" style="margin-top:10px">${items.stok.map((n,i)=>`<label>${n}<input type="number" min="0" id="stok_${i}" placeholder="Sisa/stok"></label>`).join('')}</div></section>`;html+=`<section class="card"><b>Cek Barang Kurang</b><div class="grid" style="margin-top:10px">${items.kurang.map((n,i)=>`<label style="display:flex;align-items:center;gap:8px"><input style="width:auto" type="checkbox" id="kurang_${i}"> ${n}</label>`).join('')}</div></section>`;area.innerHTML=html;hitung()}
function ambilKel(k){return items[k].map((it,i)=>{let jumlah=+document.getElementById(`${k}_${i}`).value||0;return {nama:it.nama,harga:+it.harga||0,jumlah,total:jumlah*(+it.harga||0)}})}
function buatData(){let produk=ambilKel('produk'),extra=ambilKel('extra'),minuman=ambilKel('minuman');let total=[...produk,...extra,...minuman].reduce((a,b)=>a+b.total,0);return {id:Date.now(),waktu:new Date().toLocaleString('id-ID'),tanggal:tanggal.value,catatan:catatan.value,produk,extra,minuman,stok:items.stok.map((nama,i)=>({nama,sisa:+document.getElementById('stok_'+i).value||0})),kurang:items.kurang.map((nama,i)=>({nama,kurang:document.getElementById('kurang_'+i).checked})),total}}
function hitung(){let total=0;['produk','extra','minuman'].forEach(k=>items[k].forEach((it,i)=>total+=(+document.getElementById(`${k}_${i}`)?.value||0)*(+it.harga||0)));grand.textContent=rp(total)}
function simpan(noAlert=false){let d=buatData();let key='laporan_'+d.tanggal;let arr=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(arr))arr=[arr];arr.push(d);localStorage.setItem(key,JSON.stringify(arr));if(!noAlert)alert('Tersimpan');resetForm()}
function resetForm(){document.querySelectorAll('input[type=number]').forEach(x=>x.value=0);document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);catatan.value='';hitung()}
function kirimWA(){let d=buatData();simpan(true);let txt=`*LAPORAN PENJUALAN*\nTanggal: ${d.tanggal}\nWaktu: ${d.waktu}\n\n`;['produk','extra','minuman'].forEach(k=>{let ada=d[k].filter(x=>x.jumlah>0);txt+=`*${k.toUpperCase()}*\n`+(ada.length?ada.map(x=>`${x.nama} x${x.jumlah} = ${rp(x.total)}`).join('\n'):'-')+'\n\n'});txt+=`*TOTAL: ${rp(d.total)}*`;if(d.catatan)txt+=`\nCatatan: ${d.catatan}`;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}render();</script></body></html>
