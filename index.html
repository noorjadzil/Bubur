<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasir Bubur</title><link rel="stylesheet" href="style.css"></head><body>
<header class="hero"><h1 id="namaUsaha">Kasir Bubur</h1><p>Dashboard kasir cepat, laporan, dan setting.</p></header>
<main class="wrap">
  <div class="summary-grid">
    <div class="card"><div class="muted small">Hari ini</div><div class="big-number" id="trxHari">0</div><div class="small">transaksi</div></div>
    <div class="card"><div class="muted small">Omzet hari ini</div><div class="big-number" id="omzetHari">Rp 0</div></div>
  </div>
  <div class="top-menu">
    <a href="input.html"><div>Input Transaksi<br><span>Kasir cepat, otomatis reset setelah simpan</span></div><b>›</b></a>
    <a href="laporan.html"><div>Laporan<br><span>Per transaksi, per hari, per bulan</span></div><b>›</b></a>
    <a href="setting.html"><div>Setting<br><span>Atur item, harga, kategori, dan WhatsApp</span></div><b>›</b></a>
  </div>
</main><div id="navbox"></div><script src="db.js"></script><script>
window.onload=async()=>{const S=await getSettings();namaUsaha.textContent=S.namaUsaha;navbox.innerHTML=nav('index');const reports=await getReports();const h=today();const todayReports=reports.filter(r=>hariKey(r.waktu)===h);trxHari.textContent=todayReports.length;omzetHari.textContent=rupiah(todayReports.reduce((a,b)=>a+Number(b.total||0),0));}
</script></body></html>
